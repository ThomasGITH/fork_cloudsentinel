schema_version: 1
id: isolation-forest
name: Isolation Forest
version: 1.0.0
description: Detects anomalous independent timestamp observations in multivariate metrics using Isolation Forest.
supported_modalities:
  - metrics
capabilities:
  training:
    enabled: true
    protocol: cloudsentinel.training/v1
    input_profile: metrics-partition-v1
  inference:
    enabled: true
    protocol: cloudsentinel.inference/v1
    input_profile: metrics-matrix/v1
    artifact_format: sklearn-pipeline-joblib-v1
  prediction:
    enabled: true
input_requirements:
  training:
    format: Numeric two-dimensional matrix
    shape: [n_samples, n_features]
    observation: One independent timestamp observation per row
    feature_identity: Stable positional feature order
    timestamps_included: false
    labels_required: false
    finite_values_required: true
  evaluation:
    format: Numeric two-dimensional matrix
    feature_order_must_match_training: true
    labels:
      normal: 0
      anomaly: 1
  prediction:
    format: Numeric two-dimensional matrix
    feature_order_must_match_training: true
  sequence_processing:
    lookback: false
    windowing: false
training_parameters:
  n_estimators:
    type: integer
    default: 100
    minimum: 1
    advanced: false
    description: Number of isolation trees.
  max_samples:
    type: string
    default: auto
    allowed_values: [auto]
    advanced: true
    description: Number of training observations sampled for each tree.
  contamination:
    type: string
    default: auto
    allowed_values: [auto]
    advanced: true
    description: Automatic strategy for determining the binary anomaly threshold.
  max_features:
    type: number
    default: 1.0
    exclusive_minimum: 0
    maximum: 1.0
    advanced: true
    description: Fraction of features sampled for each tree.
  bootstrap:
    type: boolean
    default: false
    advanced: true
    description: Whether individual trees use bootstrap samples.
  random_state:
    type: integer
    default: 42
    advanced: true
    description: Seed for deterministic model construction.
  n_jobs:
    type: integer
    default: 1
    excluded_values: [0]
    advanced: true
    description: Non-zero number of parallel jobs used by Isolation Forest; negative values follow scikit-learn semantics.
entry_point: detectors.isolation_forest.adapter:IsolationForestAdapter
