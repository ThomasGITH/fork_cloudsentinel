{% if payload.total %}<nav class="mt-3 d-flex justify-content-between align-items-center" aria-label="Result pages"><span>Page {{ payload.page }} of {{ payload.pages }} · {{ payload.total }} results</span><div class="btn-group">{% if previous %}<a class="btn btn-outline-primary" href="{{ previous }}">Previous</a>{% endif %}{% if next %}<a class="btn btn-outline-primary" href="{{ next }}">Next</a>{% endif %}</div></nav>{% endif %}
