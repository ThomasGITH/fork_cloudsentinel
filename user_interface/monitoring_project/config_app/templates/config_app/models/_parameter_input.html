<div class="parameter-field"><label for="param-{{ detector.id }}-{{ field.name }}" class="form-label fw-bold">{{ field.name }}</label>
{% if field.allowed_values %}<select id="param-{{ detector.id }}-{{ field.name }}" name="param__{{ detector.id }}__{{ field.name }}" class="form-select">{% if field.nullable %}<option value="__none__"{% if field.default == None %} selected{% endif %}>Auto / None</option>{% endif %}{% for value in field.allowed_values %}<option value="{{ value }}"{% if value == field.default %} selected{% endif %}>{{ value }}</option>{% endfor %}</select>
{% elif field.type == 'boolean' %}<select id="param-{{ detector.id }}-{{ field.name }}" name="param__{{ detector.id }}__{{ field.name }}" class="form-select"><option value="true"{% if field.default %} selected{% endif %}>True</option><option value="false"{% if not field.default %} selected{% endif %}>False</option></select>
{% elif field.nullable %}<select class="form-select mb-2" aria-label="{{ field.name }} value mode" data-nullable-mode><option value="none"{% if field.default == None %} selected{% endif %}>Auto / None</option><option value="value"{% if field.default != None %} selected{% endif %}>Custom value</option></select><input id="param-{{ detector.id }}-{{ field.name }}" name="param__{{ detector.id }}__{{ field.name }}" type="{% if field.type == 'string' %}text{% else %}number{% endif %}" class="form-control" value="{% if field.default == None %}__none__{% else %}{{ field.default_text }}{% endif %}"{% if field.type == 'integer' %} step="1"{% elif field.type == 'number' %} step="any"{% endif %}{% if field.minimum != None %} min="{{ field.minimum }}"{% endif %}{% if field.maximum != None %} max="{{ field.maximum }}"{% endif %}>
{% else %}<input id="param-{{ detector.id }}-{{ field.name }}" name="param__{{ detector.id }}__{{ field.name }}" type="{% if field.type == 'string' %}text{% else %}number{% endif %}" class="form-control" value="{{ field.default_text }}"{% if field.type == 'integer' %} step="1"{% elif field.type == 'number' %} step="any"{% endif %}{% if field.minimum != None %} min="{{ field.minimum }}"{% endif %}{% if field.maximum != None %} max="{{ field.maximum }}"{% endif %} required>{% endif %}
<div class="form-text">{{ field.description }} Default: {{ field.default|default_if_none:"None" }}.{% if field.excluded_values %} Excluded: {{ field.excluded_values|join:", " }}.{% endif %}</div></div>
