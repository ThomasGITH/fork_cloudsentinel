{{ initial_queries|json_script:"initial-queries" }}
<input type="hidden" name="queries_json" value="">
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2 class="catalogue-section-title mb-1">Prometheus queries</h2>
    <p class="form-help mb-0">Templates may use only <code>${namespace}</code>, <code>${pod}</code>, and <code>${service}</code>.</p>
  </div>
  <button type="button" class="btn btn-outline-primary btn-sm" data-add-query>Add query</button>
</div>
<div data-query-list></div>
<template id="query-card-template">
  <fieldset class="card catalogue-card query-card mb-3 p-3" data-query-card>
    <legend class="float-none w-auto px-1">Query <span data-query-number></span></legend>
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label required-mark">Query ID</label><input class="form-control" data-query-field="query_id" required maxlength="80"></div>
      <div class="col-md-4"><label class="form-label required-mark">Display name</label><input class="form-control" data-query-field="display_name" required maxlength="160"></div>
      <div class="col-md-4"><label class="form-label">Feature name</label><input class="form-control" data-query-field="feature_name" maxlength="160"></div>
      <div class="col-12"><label class="form-label required-mark">PromQL</label><textarea class="form-control catalogue-id" data-query-field="promql_template" rows="3" required></textarea></div>
      <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="form-check"><input class="form-check-input" type="checkbox" data-query-field="required"><label class="form-check-label">Required query</label></div>
        <button type="button" class="btn btn-outline-danger btn-sm query-remove" data-remove-query>Remove query</button>
      </div>
    </div>
    <details class="mt-3">
      <summary class="fw-bold">Advanced query settings</summary>
      <div class="row g-3 mt-1">
        <div class="col-md-4"><label class="form-label">Execution mode</label><select class="form-select" data-query-field="execution_mode"><option value="single">Single</option><option value="per_target">Per target</option></select></div>
        <div class="col-md-4"><label class="form-label">Target type</label><select class="form-select" data-query-field="target_type"><option value="">None</option><option value="pod">Pod</option><option value="service">Service</option></select></div>
        <div class="col-md-4"><label class="form-label">Identity labels</label><input class="form-control" data-query-field="identity_labels" placeholder="pod, container"></div>
        <div class="col-md-6"><label class="form-label">Target pod context</label><input class="form-control" data-query-field="target_context_pod"></div>
        <div class="col-md-6"><label class="form-label">Target service context</label><input class="form-control" data-query-field="target_context_service"></div>
        <div class="col-md-6"><label class="form-label">Parameters (JSON object)</label><textarea class="form-control catalogue-id" data-query-field="parameters" rows="2" placeholder="{}"></textarea></div>
        <div class="col-md-3"><label class="form-label">Expected modality</label><input class="form-control" data-query-field="expected_modality" placeholder="metrics"></div>
        <div class="col-md-3"><label class="form-label">Expected result type</label><input class="form-control" data-query-field="expected_result_type" placeholder="matrix"></div>
      </div>
    </details>
  </fieldset>
</template>
