{% extends 'base.html' %}
{% block title %}Monitoring Status | CloudSentinel{% endblock %}
{% block content %}<main class="container py-4"><div class="d-flex justify-content-between mb-4"><div><h1>Live Monitoring</h1><p class="text-muted">Active and recent recipe-pinned monitoring sessions.</p></div><a class="btn btn-primary" href="{% url 'monitoring' %}">Start monitoring</a></div><div id="monitoring-error" class="alert alert-danger d-none" role="alert"></div><div id="monitoring-sessions" aria-live="polite"><div class="text-muted">Loading monitoring sessions…</div></div></main>
<script>
let monitoringTimer;
function text(tag,value,cls){const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node;}
async function loadSessions(){const root=document.getElementById('monitoring-sessions');const errorNode=document.getElementById('monitoring-error');try{const response=await fetch('{% url "fetch_active_tasks" %}',{cache:'no-store',headers:{'Accept':'application/json'}});const body=await response.text();let sessions;try{sessions=JSON.parse(body);}catch(_error){throw new Error('Monitoring status returned an invalid response.');}if(!response.ok||!Array.isArray(sessions))throw new Error('Monitoring status is temporarily unavailable.');errorNode.textContent='';errorNode.classList.add('d-none');root.replaceChildren();if(!sessions.length)root.append(text('div','No monitoring sessions found.','alert alert-secondary'));sessions.forEach(session=>{const card=text('article','', 'card mb-3');const body=text('div','', 'card-body');body.append(text('h2',session.model_id||'Unknown saved model','h5'));body.append(text('div','Status: '+(session.status||'Unavailable')));body.append(text('div','Buffered observations: '+(session.buffered_observations||0)));body.append(text('div','Warm-up observations: '+(session.warmup_observations||0)));if(session.latest_result)body.append(text('div','Latest anomalies: '+(session.latest_result.anomaly_count??'Unavailable')));if(session.error)body.append(text('div',session.error,'alert alert-danger mt-2'));const stop=text('button','Stop','btn btn-outline-danger btn-sm mt-3');stop.disabled=['stopped','error'].includes(session.status);stop.onclick=async()=>{stop.disabled=true;try{const stopResponse=await fetch('/stop-task/'+encodeURIComponent(session.session_id)+'/',{method:'POST',headers:{'X-CSRFToken':'{{ csrf_token }}','Accept':'application/json'}});if(!stopResponse.ok)throw new Error();await loadSessions();}catch(_error){errorNode.textContent='The monitoring session could not be stopped.';errorNode.classList.remove('d-none');}};body.append(stop);card.append(body);root.append(card);});}catch(error){errorNode.textContent=error.message;errorNode.classList.remove('d-none');root.replaceChildren(text('div','Monitoring sessions could not be loaded. Retrying automatically…','alert alert-secondary'));}clearTimeout(monitoringTimer);monitoringTimer=setTimeout(loadSessions,4000);}
window.addEventListener('pagehide',()=>clearTimeout(monitoringTimer));loadSessions();
</script>{% endblock %}
