{% extends 'base.html' %}
{% block title %}Monitoring Status | CloudSentinel{% endblock %}
{% block content %}<main class="container py-4"><div class="d-flex justify-content-between mb-4"><div><h1>Live Monitoring</h1><p class="text-muted">Active and recent recipe-pinned monitoring sessions.</p></div><a class="btn btn-primary" href="{% url 'monitoring' %}">Start monitoring</a></div><div id="monitoring-error" class="alert alert-danger d-none"></div><div id="monitoring-sessions"><div class="text-muted">Loading monitoring sessions…</div></div></main>
<script>
let monitoringTimer;
function text(tag,value,cls){const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node;}
async function loadSessions(){try{const response=await fetch('{% url "fetch_active_tasks" %}',{cache:'no-store'});const sessions=await response.json();if(!response.ok)throw new Error('Monitoring status is temporarily unavailable.');const root=document.getElementById('monitoring-sessions');root.replaceChildren();if(!sessions.length)root.append(text('div','No monitoring sessions found.','alert alert-secondary'));sessions.forEach(session=>{const card=text('article','', 'card mb-3');const body=text('div','', 'card-body');body.append(text('h2',session.model_id,'h5'));body.append(text('div','Status: '+session.status));body.append(text('div','Buffered observations: '+(session.buffered_observations||0)));body.append(text('div','Warm-up observations: '+(session.warmup_observations||0)));if(session.latest_result)body.append(text('div','Latest anomalies: '+(session.latest_result.anomaly_count??'Unavailable')));if(session.error)body.append(text('div',session.error,'alert alert-danger mt-2'));const stop=text('button','Stop','btn btn-outline-danger btn-sm mt-3');stop.disabled=['stopped','error'].includes(session.status);stop.onclick=async()=>{await fetch('/stop-task/'+encodeURIComponent(session.session_id)+'/',{method:'POST',headers:{'X-CSRFToken':'{{ csrf_token }}'}});loadSessions();};body.append(stop);card.append(body);root.append(card);});}catch(error){const node=document.getElementById('monitoring-error');node.textContent=error.message;node.classList.remove('d-none');}monitoringTimer=setTimeout(loadSessions,4000);}
window.addEventListener('pagehide',()=>clearTimeout(monitoringTimer));loadSessions();
</script>{% endblock %}
