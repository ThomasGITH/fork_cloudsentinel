apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-processing-deployment
  namespace: cloudsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-processing
  template:
    metadata:
      labels:
        app: data-processing
    spec:
      containers:
      - name: data-processing
        image: jojojochem/data_processing:generic-detection-migration-1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: API_GENERIC_ANOMALY_DETECTION_URL
          value: "http://generic-anomaly-detection-service.cloudsentinel.svc.cluster.local:80"
        - name: API_LEARNING_ADAPTATION_URL
          value: "http://learning-adaptation-service.cloudsentinel.svc.cluster.local:80"
---
apiVersion: v1
kind: Service
metadata:
  name: data-processing-service
  namespace: cloudsentinel
spec:
  selector:
    app: data-processing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5002
