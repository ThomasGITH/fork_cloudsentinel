apiVersion: apps/v1
kind: Deployment
metadata:
  name: crca-anomaly-detection-deployment
  namespace: cloudsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crca-anomaly-detection
  template:
    metadata:
      labels:
        app: crca-anomaly-detection
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: crca-anomaly-detection
        image: jojojochem/anomaly_detection_crca:expand-rca-2
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        ports:
        - containerPort: 5023
        env:
        - name: CELERY_BROKER_URL
          value: "redis://redis:6379/1"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis:6379/1"
        - name: MONITORING_HISTORY_STORAGE_ROOT
          value: "/app/storage/monitoring_history"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5023
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5023
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: crca-anomaly-detection-service
  namespace: cloudsentinel
spec:
  selector:
    app: crca-anomaly-detection
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5023
