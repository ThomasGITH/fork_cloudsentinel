apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-adaptation-celery-deployment
  namespace: cloudsentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learning-adaptation-celery
  template:
    metadata:
      labels:
        app: learning-adaptation-celery
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: learning-adaptation-celery
        image: jojojochem/learning_adaptation:comparison-robustness-1
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "app.celery", "worker", "--loglevel=info", "-P", "gevent", "--concurrency=1"]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          capabilities:
            drop:
            - ALL
        env:
        - name: TRAINED_MODELS_TEMP_ROOT
          value: "/app/storage/trained_models_temp"
        - name: CELERY_BROKER_URL
          value: "redis://redis.cloudsentinel.svc.cluster.local:6379/2"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis.cloudsentinel.svc.cluster.local:6379/2"
        - name: DATASET_SNAPSHOT_STORAGE_ROOT
          value: "/app/storage/dataset_snapshots"
        - name: TRAINING_RUN_STORAGE_ROOT
          value: "/app/storage/training_runs"
        - name: MODEL_CATALOGUE_STORAGE_ROOT
          value: "/app/storage/models"
        - name: COMPARISON_STORAGE_ROOT
          value: "/app/storage/comparisons"
        - name: MODEL_ARTIFACT_STORAGE_ROOT
          value: "/app/storage/model_artifacts"
        - name: API_DATA_CATALOGUE_URL
          value: "http://data-ingestion-service.cloudsentinel.svc.cluster.local:80"
        - name: API_GENERIC_ANOMALY_DETECTION_URL
          value: "http://generic-anomaly-detection-service.cloudsentinel.svc.cluster.local:80"
        - name: COMPARISON_MAX_TIMELINE_POINTS
          value: "1000"
        - name: DETECTOR_PLUGIN_ROOTS
          value: "/opt/cloudsentinel/detectors/active"
        volumeMounts:
        - name: learning-storage
          mountPath: /app/storage
        - name: detector-plugins
          mountPath: /opt/cloudsentinel/detectors
          readOnly: true
        - name: model-artifacts
          mountPath: /app/storage/model_artifacts
          readOnly: false
        resources:
          requests:
            memory: "4Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "2"
      volumes:
      - name: learning-storage
        persistentVolumeClaim:
          claimName: learning-adaptation-pvc
      - name: detector-plugins
        persistentVolumeClaim:
          claimName: detector-plugin-repository-pvc
      - name: model-artifacts
        persistentVolumeClaim:
          claimName: model-artifact-pvc
